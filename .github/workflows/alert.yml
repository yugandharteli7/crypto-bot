name: 24/7 Crypto Alert

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs automatically every 5 minutes 24/7
  workflow_dispatch:        # Allows you to test it manually anytime

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run Alert Check
        run: python bot.py
